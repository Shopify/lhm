name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Run tests
    # ubuntu-26.04: trilogy fails to link -lcrypto with the Ruby 3.2 toolcache build
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        activerecord: ["7.2", "8.0", "8.1", "head"]
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0", "head"]
        mysql: ["5.7", "8.0"]
        adapter: ["mysql2", "trilogy"]
        exclude:
          - activerecord: 6.1
            ruby: head
          - activerecord: 7.2
            ruby: head
          # activesupport 8.0 passes `quirks_mode:` to JSON.generate, which ruby-head's json rejects
          - activerecord: 8.0
            ruby: head
          - activerecord: 8.0
            ruby: 3.1
          - activerecord: 8.1
            ruby: 3.1
          - activerecord: head
            ruby: 3.1

    env:
      BUNDLE_GEMFILE: "${{ github.workspace }}/gemfiles/activerecord_${{ matrix.activerecord }}.gemfile"
      DATABASE_ADAPTER: "${{ matrix.adapter }}"

    steps:
      - uses: actions/checkout@v4

      # Native gem extensions (mysql2, trilogy) are built during bundler-cache, so headers must exist first
      - name: Install Ubuntu packages
        run: sudo apt-get update && sudo apt-get install numactl libaio-dev libmysqlclient-dev libssl-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{matrix.ruby}}
          bundler-cache: true

      - name: Setup MySQL and ProxySQL (docker-compose)
        # Might have to change to docker compose up -d (i.e. Compose V2) when the Ubuntu image changes the docker-compose version
        run: docker compose -f docker-compose-mysql-${{ matrix.mysql }}.yml up -d

      - name: Wait until DBs are alive
        run: ./scripts/helpers/wait-for-dbs.sh
        timeout-minutes: 2

      - name: Run tests
        run: bundle exec rake specs
